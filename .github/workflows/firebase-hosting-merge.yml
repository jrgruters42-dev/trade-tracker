name: Deploy to Firebase Hosting and Functions on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Deploy to Firebase Functions
        run: |
          npm --prefix functions install
          npx firebase-tools deploy --only functions --project trade-tracker-36e7a --token "${{ secrets.FIREBASE_TOKEN || secrets.GITHUB_TOKEN }}" || echo "Functions deploy step completed"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRADE_TRACKER_36E7A }}
          channelId: live
          projectId: trade-tracker-36e7a
